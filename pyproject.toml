[project]
name = "media-converter"
version = "1.0.0"
description = "Автоконвертер медиа-ресурсов для веба"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "pillow>=10.2.0",
    "pillow-avif-plugin>=1.4.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]

[project.scripts]
media-converter = "src.cli.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]