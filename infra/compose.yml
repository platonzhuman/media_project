services:
  converter:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: media_converter
    volumes:
      - ../media:/app/media
      - ../output:/app/output
      - ../settings.toml:/app/settings.toml:ro
      - ../logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped